function mealBudget(){const t=targets(),used=sum(entries().filter(x=>x.eaten||x.type!==st.smartMeal).map(x=>calc(x.items)));const left={};for(const k of ['k','c','p','f','s'])left[k]=t[k]-used[k];return {t,used,left}}

function optimizeItems(items,budget){

   let mult=isOil(x.id)?[0,.25,.5,.75,1]:isStarch(x.id)?[.25,.4,.5,.65,.8,1,1.15]:isProtein(x.id)?[.5,.75,1,1.25,1.5,1.75]:[.5,.75,1,1.25];
   return [...new Set(mult.map(m=>Math.round(g*m*10)/10))];
 });
 let current=base.map(x=>({...x,g:x.g}));
 function evaluate(xs){
   const n=calc(xs);
   let excess=0;for(const k of caps)excess+=Math.max(0,n[k]-Math.max(0,left[k]))/Math.max(1,left[k]||1)*20;
   const kcalTarget=Math.max(0,left.k)*.86;
   const proteinTarget=Math.max(0,left.p);
   const kcalGap=Math.abs(n.k-kcalTarget)/Math.max(120,kcalTarget);
   const proteinGap=Math.max(0,proteinTarget-n.p)/Math.max(20,proteinTarget);

   return {score:excess*100+kcalGap*.9+proteinGap*1.3+tiny+deviation,n,excess};
 }
 // Multi-start coordinate descent avoids proportional shrinking of every ingredient.
 let best=null;
 for(const start of [.45,.7,1]){
  let xs=base.map((x,i)=>({...x,g:candidates[i].reduce((a,b)=>Math.abs(b-x.g*start)<Math.abs(a-x.g*start)?b:a,candidates[i][0])}));

   }
   if(!changed&&pass>1)break;

function chartWeight(rows){let a=rows.filter(x=>Number(x.weight)>0).slice(0,30).reverse();if(a.length<2)return '<div class="empty">체중을 2회 이상 기록하면 추세 그래프가 표시돼요.</div>';let w=620,h=180,min=Math.min(...a.map(x=>x.weight))-.5,max=Math.max(...a.map(x=>x.weight))+.5,coords=a.map((x,i)=>[35+i*(w-65)/Math.max(1,a.length-1),h-28-(x.weight-min)/(max-min)*(h-50)]),pts=coords.map(x=>x.join(',')).join(' ');return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="체중 추세 그래프"><line x1="35" y1="${h-28}" x2="${w-20}" y2="${h-28}" stroke="#dbe5dd"/><polyline points="${pts}" fill="none" stroke="#3e996a" stroke-width="3" stroke-linejoin="round"/>${coords.map(([x,y],i)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#3e996a"><title>${a[i].date}: ${a[i].weight}kg</title></circle>`).join('')}<text x="4" y="18" font-size="12" fill="#809083">${round(max,1)}</text><text x="4" y="${h-28}" font-size="12" fill="#809083">${round(min,1)}</text></svg>`}

 $('#overlay').innerHTML=`<div class="modalbg" onclick="closeProductEditor(event)"><div class="modal" onclick="event.stopPropagation()"><div class="between"><h2>영양제 제품 ${i<0?'등록':'수정'}</h2><button class="btn sm" onclick="closeProductEditor()">✕</button></div><div class="grid g2"><label class="field">제품명<input class="input" id="pn_name" value="${esc(p.name)}"></label><label class="field">1회분 기준<input class="input" id="pn_serving" value="${esc(p.serving||'1회분')}" placeholder="예: 2캡슐"></label></div><div class="note" style="margin:12px 0"><b>무료 자동 입력</b><div class="pills" style="margin:8px 0"><button class="btn sm" onclick="suppLookup()">해외 DB 검색</button><button class="btn sm" onclick="suppKorea()">국내 DB 검색</button><button class="btn sm" onclick="suppWeb()">웹 검색</button></div><div id="suppResults"></div><label class="field">성분표 사진 또는 캡처<input type="file" accept="image/*" onchange="suppOCR(this)"></label><div id="suppProgress" class="mini"></div><label class="field">성분표 텍스트 (복사 또는 사진 인식 결과)<textarea id="suppText" rows="6" placeholder="Magnesium 200 mg&#10;Vitamin D 25 mcg"></textarea></label><button class="btn sm primary" onclick="suppParse()">성분 자동 입력</button><p class="mini">표시 기준이 동일한지 확인하세요. 자동 입력은 기존 칸을 덮어쓰며 확인되지 않은 값은 입력하지 않습니다.</p></div><div class="grid g2">${fields}</div><label class="mini"><input type="checkbox" id="pn_verified" ${p.verified?'checked':''}> 제품 포장지/제조사 성분표를 직접 확인했음</label><p class="mini muted">빈 칸은 0이 아니라 미확인입니다. 칼슘·철·마그네슘 등은 성분표의 실제 원소 함량을 입력하세요. 비타민 D는 μg 단위(1 μg = 40 IU)입니다.</p><button class="btn primary" style="margin-top:14px" onclick="saveSupplementProduct(${i})">제품 정보 저장</button></div></div>`;

const SUP_ALIASES={calcium:'calcium|칼슘',iron:'iron|철분|철',vitc:'vitamin\\s*c|비타민\\s*c',b12:'vitamin\\s*b12|비타민\\s*b12',vitd:'vitamin\\s*d3?|비타민\\s*d3?',magnesium:'magnesium|마그네슘',zinc:'zinc|아연',omega3:'epa\\s*\\+\\s*dha|epa\\s*및\\s*dha|epa와\\s*dha의\\s*합',b1:'thiamin[e]?|vitamin\\s*b1|비타민\\s*b1',b2:'riboflavin|vitamin\\s*b2|비타민\\s*b2',b3:'niacin|나이아신|니아신',b5:'pantothenic acid|판토텐산',b6:'vitamin\\s*b6|비타민\\s*b6',biotin:'biotin|비오틴',folate:'folate|folic acid|엽산',selenium:'selenium|셀레늄|셀렌',iodine:'iodine|요오드',inositol:'inositol|이노시톨',vitk:'vitamin\\s*k2?|비타민\\s*k2?',copper:'copper|구리',manganese:'manganese|망간'};
Object.assign(SUP_ALIASES,{vite:'vitamin\\s*e|비타민\\s*e',vita:'vitamin\\s*a|비타민\\s*a',fiber:'dietary fiber|식이섬유',potassium:'potassium|칼륨',sodium:'sodium|나트륨',phosphorus:'phosphorus|인',chromium:'chromium|크롬',molybdenum:'molybdenum|몰리브덴',epa:'EPA',dha:'DHA',choline:'choline|콜린',lutein:'lutein|루테인',coq10:'coenzyme Q10|CoQ10|코엔자임\\s*Q10',probiotic:'probiotics|유산균|보장균수'});
function suppConvert(v,u,target,k){u=u.toLowerCase().replace(/[μµ]/g,'u');if(u==='cfu')return target==='CFU'?v:null;if(target==='CFU')return null;if(u==='iu')return k==='vitd'?v/40:null;const f={g:1000,mg:1,mcg:.001,ug:.001};return f[u]===undefined?null:v*f[u]/(target==='μg'?.001:target==='g'?1000:1)}
function suppParse(){const t=$('#suppText').value.normalize('NFKC');let count=0;for(const [k,,unit] of NUTRIENTS){if(!SUP_ALIASES[k])continue;const re=new RegExp('(?:^|[^a-zA-Z0-9])(?:'+SUP_ALIASES[k]+')(?![a-zA-Z0-9])\\s*(?:\\([^\\n)]*\\))?\\s*[:：-]?\\s*([0-9]+(?:,[0-9]{3})*(?:\\.[0-9]+)?)\\s*(mcg|[μµu]g|mg|g|IU|CFU)(?![a-zA-Z])','im');const m=t.match(re);if(!m)continue;const v=suppConvert(Number(m[1].replace(/,/g,'')),m[2],unit,k);if(v!==null&&Number.isFinite(v)&&v<=1e15&&$('#pn_'+k)){$('#pn_'+k).value=Number(v.toPrecision(10));count++}}$('#pn_verified').checked=false;notify(count?count+'개 성분 입력 · 기준량과 단위 확인 필요':'인식된 성분이 없어요. 성분명과 숫자, 단위를 확인해 주세요')}
function suppWeb(){const q=$('#pn_name').value.trim();if(q)window.open('https://www.google.com/search?q='+encodeURIComponent(q+' supplement facts 영양성분'),'_blank','noopener,noreferrer')}
async function suppOCR(input){const file=input.files[0],out=$('#suppProgress'),target=$('#suppText');if(!file)return;let worker;try{out.textContent='문자 인식 준비 중 (최초 인터넷 필요)';if(!window.Tesseract)await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';sc.onload=resolve;sc.onerror=reject;document.head.append(sc)});worker=await Tesseract.createWorker('kor+eng',1,{logger:m=>{out.textContent='문자 인식 '+Math.round((m.progress||0)*100)+'%'}});const result=await worker.recognize(await enhanceLabel(file));if(!target.isConnected)return;target.value=result.data.text;out.textContent='인식 완료 · 원본과 비교 후 성분 자동 입력을 누르세요';}catch(e){out.textContent='사진 인식 실패 · 인터넷 확인 또는 텍스트 붙여넣기'}finally{if(worker)await worker.terminate()}}
async function suppLookup(){const q=$('#pn_name').value.trim(),out=$('#suppResults');if(!q)return notify('제품명을 입력하세요');out.textContent='검색 중…';try{const r=await fetch('https://api.ods.od.nih.gov/dsld/v9/search-filter?q='+encodeURIComponent(q)+'&size=10');if(!r.ok)throw Error(r.status);const j=await r.json();const hits=j.hits?.hits||j.hits||j.results||[];if(!Array.isArray(hits)||!hits.length){out.textContent='검색 결과 없음 · 사진 또는 텍스트 등록을 이용하세요';return}out.replaceChildren();for(const h of hits){const a=h._source||h;const id=a.dsldId||a.id||h._id;const name=a.fullName||a.productName||a.name;if(!id||!name)continue;const b=document.createElement('button');b.className='btn sm';b.textContent=name;b.onclick=()=>suppDetail(id,name,out);out.append(b,document.createElement('br'))}if(!out.children.length)out.textContent='지원되지 않는 응답 형식 · 사진 또는 텍스트를 이용하세요'}catch(e){out.textContent='해외 DB 연결 실패 · 사진 또는 텍스트를 이용하세요'}}
async function suppDetail(id,name,out){try{const r=await fetch('https://api.ods.od.nih.gov/dsld/v9/label/'+encodeURIComponent(id));if(!r.ok)throw Error(r.status);const j=await r.json();const rows=j.ingredientRows||[];const lines=[];for(const a of rows){const qs=a.quantity||a.quantities||[];if(!Array.isArray(qs)||qs.length!==1)continue;const x=qs[0];if(x.quantity!=null&&x.unit)lines.push((a.name||a.ingredientName||'')+' '+x.quantity+' '+x.unit)}if(!lines.length)throw Error('no supported quantities');$('#suppText').value=lines.join('\n');$('#pn_name').value=name;out.textContent='성분표 가져옴 · 1회분 기준을 제품 라벨에서 확인하세요';suppParse()}catch(e){out.textContent='성분 자동 추출 불가 · 제품 라벨 사진을 이용하세요'}}
function suppKorea(){const q=$('#pn_name').value.trim();window.open('https://www.foodsafetykorea.go.kr/portal/healthyfoodlife/searchHomeHF.do','_blank','noopener,noreferrer');$('#suppResults').textContent='식약처 제품 검색에서 '+q+' 검색 후 성분표를 복사하거나 캡처하세요. 국내 자동 API 연결은 무료 인증키 발급 및 별도 설정이 필요합니다.'}

function closeProductEditor(e){if(e&&e.target!==e.currentTarget)return;$('#overlay').innerHTML='';render()}
function saveSupplementProduct(i){
 const name=$('#pn_name').value.trim(),serving=$('#pn_serving').value.trim();if(!name||!serving)return notify('제품명과 1회분을 입력해 주세요');
 const nutrients={};for(const [k] of NUTRIENTS){const raw=$('#pn_'+k).value;if(raw==='')continue;const v=Number(raw);if(!Number.isFinite(v)||v<0||v>1e15)return notify('성분 함량을 확인해 주세요');nutrients[k]=v}
 const p={id:i>=0?productCatalog()[i].id:'supp_'+Date.now(),name,serving,nutrients,verified:$('#pn_verified').checked};st.supplementProducts=productCatalog();if(i>=0)st.supplementProducts[i]=p;else st.supplementProducts.push(p);save();closeProductEditor();notify('제품 정보가 저장됐어요');
}
function removeSupplement(i){if(!confirm('등록 제품을 삭제할까요? 과거 복용 기록은 유지됩니다.'))return;st.supplementProducts.splice(i,1);save();render()}
function exportSupplementJson(){const blob=new Blob([JSON.stringify({schema:'myline-supplements-v1',products:productCatalog()},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MY_LINE_supplements.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importSupplementJson(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.schema!=='myline-supplements-v1'||!Array.isArray(j.products))throw Error('지원하지 않는 파일');let products=[];for(const p of j.products){if(!p.name||!p.serving||typeof p.nutrients!=='object'||!p.nutrients||Array.isArray(p.nutrients))throw Error('제품 정보 오류');const n={};for(const [k,v] of Object.entries(p.nutrients)){if(!NUTRIENTS.some(x=>x[0]===k)||!Number.isFinite(Number(v))||Number(v)<0)throw Error('영양성분 오류');n[k]=Number(v)}products.push({id:'supp_import_'+Date.now()+'_'+products.length,name:String(p.name).slice(0,150),serving:String(p.serving).slice(0,80),nutrients:n,verified:false})}if(!confirm(`${products.length}개 제품을 불러올까요? 기존 제품은 유지되며 같은 이름은 교체됩니다. 불러온 함량은 반드시 성분표로 확인해 주세요.`))return;const list=productCatalog();for(const p of products){let i=list.findIndex(x=>x.name===p.name);if(i>=0){p.id=list[i].id;list[i]=p}else list.push(p)}st.supplementProducts=list;save();render();notify('제품을 불러왔어요. 성분표를 검증해 주세요')}catch(e){notify('제품 JSON 형식이 올바르지 않아요: '+e.message)}};r.readAsText(f)};input.click()}
function saveSupplementIntake(){
 st.wellness=st.wellness||{};const w=st.wellness[st.date]||(st.wellness[st.date]={});
 w.productIntake=productCatalog().filter(p=>$('#take_'+p.id)?.checked).map(p=>({id:p.id,name:p.name,serving:p.serving,nutrients:clone(p.nutrients),verified:p.verified}));save();render();notify('오늘 영양제 복용을 저장했어요');
}
function supplementIntakePanel(){const w=(st.wellness||{})[st.date]||{},old=w.productIntake||[];return `<div class="panel"><div class="between wrap"><b>오늘 복용한 등록 제품</b><button class="btn sm" onclick="go('settings')">제품 관리</button></div>${productCatalog().length?productCatalog().map(p=>`<label class="listline"><span><input type="checkbox" id="take_${esc(p.id)}" ${old.some(x=>x.id===p.id)?'checked':''}> <b>${esc(p.name)}</b></span><span class="mini muted">${esc(p.serving)}</span></label>`).join(''):'<p class="mini muted">설정에서 영양제 제품을 먼저 등록해 주세요. 기존 영양제 체크는 컨디션에서 계속 사용할 수 있어요.</p>'}<button class="btn primary" onclick="saveSupplementIntake()">복용 제품 저장</button>${supplementSummary()}</div>`}
function supplementSummary(){const w=(st.wellness||{})[st.date]||{},items=w.productIntake||[];if(!items.length)return '<p class="mini muted">등록 제품 복용 내역이 없어요.</p>';const sum={};for(const p of items)for(const [k,v] of Object.entries(p.nutrients||{}))sum[k]=(sum[k]||0)+Number(v||0);return `<div class="note" style="margin-top:12px"><b>기록된 영양제 성분 합계</b><div class="grid g2">${NUTRIENTS.filter(([k])=>sum[k]!==undefined).map(([k,n,u])=>`<div class="mini">${n} ${round(sum[k],1)}${u}</div>`).join('')}</div><p class="mini muted">등록되지 않은 성분은 합계에서 제외됩니다. 영양제 성분을 음식과 단순 합산해 섭취 적정성을 판정하지 않아요.</p></div>`}
function nutritionGuidance(items){const m=microCalc(items);const advice=[];
 if(m.missing.length)advice.push(`영양 데이터 없는 재료 ${m.missing.length}종이 있어 실제 섭취량은 더 높을 수 있어요.`);
 if(m.fiber<20)advice.push('식이섬유: 현재 기록에서 확인되는 양이 적어요. 과일·현미·버섯·채소 등으로 보완할 수 있어요.');
 if(m.calcium<700)advice.push('칼슘: 확인된 양이 적어요. 요거트·칼슘 강화 두유·두부의 제품별 함량을 확인해 보세요.');
 if(m.vitc<100)advice.push('비타민 C: 확인된 양이 적어요. 귤·오렌지·키위 등 과일을 활용할 수 있어요.');
 return `<div class="note" style="margin-top:10px"><b>영양 균형 점검 (진단 아님)</b>${advice.map(x=>`<p class="mini">• ${esc(x)}</p>`).join('')||'<p class="mini">입력된 데이터만으로 부족 여부를 확정할 수 없어요.</p>'}<p class="mini muted">일부 음식만 기록했거나 제품별 영양성분이 누락됐다면 부족 판정이 불가능합니다. 임의의 고용량 영양제 복용을 권하지 않아요.</p></div>`;
}
function wellnessPanel(){
 const w=(st.wellness||{})[st.date]||{};
 const cycle=cycleInfo();
 return `<div class="grid g2">
 <label class="field">물 섭취 (mL)<input class="input" id="waterMl" type="number" min="0" max="10000" step="50" value="${w.water??''}" placeholder="예: 2000"></label>
 <label class="field">배변 여부<select id="bowel"><option value="" ${!w.bowel?'selected':''}>미기록</option><option value="yes" ${w.bowel==='yes'?'selected':''}>배변함</option><option value="no" ${w.bowel==='no'?'selected':''}>배변하지 않음</option></select></label>
 <label class="field">배변 상태<select id="stool"><option value="">선택 안 함</option>${['딱딱함','보통','무름','설사'].map(v=>`<option ${w.stool===v?'selected':''}>${v}</option>`).join('')}</select></label>
 <label class="field">둘코락스 에스 복용 여부<select id="dulcolax"><option value="">미기록</option><option value="no" ${w.dulcolax==="no"?"selected":""}>복용 안 함</option><option value="yes" ${w.dulcolax==="yes"?"selected":""}>복용함</option></select></label><label class="field">복용 정수<input class="input" id="dulcolaxCount" type="number" min="0" max="10" step="1" value="${w.dulcolaxCount??""}" placeholder="예: 2"></label><label class="field">생리 상태<select id="period"><option value="">미기록</option>${['생리 중','생리 시작일','생리 종료','생리 아님'].map(v=>`<option ${w.period===v?'selected':''}>${v}</option>`).join('')}</select></label>
 </div><div class="hr"></div>${supplementIntakePanel()}<button class="btn primary" style="margin-top:12px" onclick="saveWellness()">오늘 컨디션 저장</button>
 <div class="note" style="margin-top:12px">${cycle}</div>`;
}
function saveWellness(){
 st.wellness=st.wellness||{};
 const water=Number($('#waterMl').value);
 if(Number($('#dulcolaxCount').value)>10)return notify('복용 정수를 확인해 주세요');if(water<0||water>10000)return notify('물 섭취량을 확인해 주세요');
 st.wellness[st.date]={...(st.wellness[st.date]||{}),water:$('#waterMl').value===''?null:water,bowel:$('#bowel').value,stool:$('#stool').value,period:$('#period').value,dulcolax:$('#dulcolax').value,dulcolaxCount:$('#dulcolaxCount').value===''?null:Number($('#dulcolaxCount').value),supplements:st.wellness[st.date]?.supplements||{}};
 save();render();notify('오늘 컨디션을 저장했어요');
}
function cycleInfo(){
 const arr=Object.entries(st.wellness||{}).filter(([d,w])=>w.period==='생리 시작일'&&d<=st.date).sort((a,b)=>b[0].localeCompare(a[0]));
 if(!arr.length)return '생리 시작일을 기록하면 주기별 컨디션을 함께 살펴볼 수 있어요. 생리 후 특정 시기에 살이 더 잘 빠진다는 보장은 없으며, 체중 변화에는 수분 변동도 영향을 줍니다.';
 const d=Math.floor((new Date(st.date+'T12:00:00')-new Date(arr[0][0]+'T12:00:00'))/86400000)+1;
 return '최근 생리 시작일 '+arr[0][0]+' · 기록상 '+d+'일째. 생리 주기와 체중·식욕·운동 컨디션을 함께 확인하세요. 특정 기간의 지방 감량 효과가 확실히 더 크다는 근거는 부족해요.';
}

async function lookupBarcode(){const code=($('#barcodeNumber')?.value||'').replace(/\D/g,'');const box=$('#barcodeResult');if(!/^\d{8,14}$/.test(code)){notify('8~14자리 바코드 숫자를 입력해 주세요');return}box.textContent='식품정보를 조회 중이에요...';try{const response=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,brands,quantity,nutriments',{headers:{'Accept':'application/json'}});if(!response.ok)throw Error('HTTP '+response.status);const v=await response.json();if(v.status!==1||!v.product){box.textContent='제품을 찾지 못했어요. 포장지 영양정보를 직접 등록할 수 있어요.';return}const x=v.product,n=x.nutriments||{};const read=(key)=>{const z=Number(n[key]);return n[key]===undefined||!Number.isFinite(z)?null:z};const kcal=read('energy-kcal_100g');const energyKj=read('energy_100g');barcodeLast={code,name:[x.brands,x.product_name].filter(Boolean).join(' · ')||'이름 미확인 제품',k:kcal??(energyKj===null?null:energyKj/4.184),p:read('proteins_100g'),c:read('carbohydrates_100g'),f:read('fat_100g'),s:read('sugars_100g'),fiber:read('fiber_100g')};const missing=['k','p','c','f','s'].filter(k=>barcodeLast[k]===null);box.innerHTML='<b>'+esc(barcodeLast.name)+'</b><p class="mini">100g당 열량 '+(barcodeLast.k===null?'미확인':fmt(barcodeLast.k)+'kcal')+' · 탄수 '+(barcodeLast.c===null?'미확인':fmt(barcodeLast.c)+'g')+' · 단백질 '+(barcodeLast.p===null?'미확인':fmt(barcodeLast.p)+'g')+' · 지방 '+(barcodeLast.f===null?'미확인':fmt(barcodeLast.f)+'g')+' · 당류 '+(barcodeLast.s===null?'미확인':fmt(barcodeLast.s)+'g')+'</p>'+(missing.length?'<p class="mini">필수 영양정보 일부가 없어 자동 등록할 수 없어요. 제품 라벨을 확인해 주세요.</p>':'<p class="mini">제품 라벨과 일치하는지 확인한 뒤 등록하세요.</p>')+'<button class="btn primary" onclick="saveBarcodeFood()" '+(missing.length?'disabled':'')+'>이 식품을 내 식품 목록에 저장</button>';}catch(e){box.textContent='조회에 실패했어요. 인터넷 연결 또는 데이터 제공 상태를 확인해 주세요.'}}
function saveBarcodeFood(){const x=barcodeLast;if(!x||['k','p','c','f','s'].some(k=>x[k]===null))return notify('영양정보를 확인해 주세요');const id='barcode_'+x.code;if(st.foods[id]&&!confirm('같은 바코드 식품 정보를 덮어쓸까요?'))return;st.foods[id]={name:x.name,k:x.k,p:x.p,c:x.c,f:x.f,s:x.s,barcode:x.code,source:'Open Food Facts · 사용자 확인 필요'};if(x.fiber!==null){st.micro=st.micro||{};st.micro[id]=[x.fiber,null,null,null,null]}save();notify('식품 목록에 등록했어요. 식단 편집에서 검색해 추가할 수 있어요.')}
async function startBarcodeCamera(){if(!('BarcodeDetector' in window)){notify('이 브라우저는 바코드 카메라 인식을 지원하지 않아요. 번호를 직접 입력해 주세요');return}try{stopBarcodeCamera();const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});barcodeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const v=$('#barcodeVideo');if(!v){stopBarcodeCamera();return}v.srcObject=barcodeStream;v.style.display='block';await v.play();barcodeTimer=setInterval(async()=>{try{if(!v.isConnected){stopBarcodeCamera();return}const hits=await detector.detect(v);if(hits.length){const code=hits[0].rawValue;stopBarcodeCamera();$('#barcodeNumber').value=code;lookupBarcode()}}catch(e){}},600)}catch(e){stopBarcodeCamera();notify('카메라를 열 수 없어요. HTTPS 주소와 카메라 권한을 확인해 주세요')}}

function editFoodValues(){let k=$('#editFoodSelect').value,f=st.foods[k];let v=prompt('100g당 kcal, 단백질g, 탄수g, 지방g, 당류g 순서로 입력',`${f.k},${f.p},${f.c},${f.f},${f.s}`);if(v===null)return;let a=v.split(',').map(Number);if(a.length!==5||a.some(x=>!Number.isFinite(x)||x<0))return notify('쉼표로 구분한 5개 숫자를 입력해 주세요');[f.k,f.p,f.c,f.f,f.s]=a;save();render();notify('영양값을 수정했어요')}function backup(){let blob=new Blob([JSON.stringify(st,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='MY_LINE_backup_'+TODAY()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restore(ev){let file=ev.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{try{let v=JSON.parse(reader.result);if(!v.foods||!v.recipes||!v.logs||!v.settings)throw Error();if(!confirm('현재 데이터를 백업 파일로 덮어쓸까요? 기존 기록은 별도 JSON으로 백업해 주세요.'))return;backup();st=v;save();render();notify('백업 복원이 완료됐어요')}catch(e){notify('올바른 MY LINE 백업 파일이 아닙니다')}};reader.readAsText(file)}function resetAll(){if(!confirm('모든 식단·체중·운동·냉장고 기록을 삭제할까요?'))return;if(!confirm('복구할 수 없습니다. 정말 초기화할까요?'))return;st=empty();save();render()}function excludeRecipe(){let v=$('#excludePick')?.value;if(v&&!st.exclude.includes(v))st.exclude.push(v);save();render()}function unexclude(v){st.exclude=st.exclude.filter(x=>x!==decodeURIComponent(v));save();render()}

function foodMicro(id,k){const f=food(id);if(f.extraNutrients&&Object.hasOwn(f.extraNutrients,k))return f.extraNutrients[k];const i=['fiber','calcium','iron','vitc','b12'].indexOf(k);return i<0?null:(st.micro?.[id]||MICRO_DEFAULT[id]||[])[i]??null}
function dailyNutrients(items){const taken=st.wellness?.[st.date]?.productIntake||[];return `<p class="mini muted">성인 여성 19–49세 일반 참고 목표 (2020 한국인 영양소 섭취기준 기반 간이 참고치). 식품 데이터는 부분 추정이며 미확인 값은 제외됩니다. 하루 수치만으로 결핍·과다를 진단할 수 없습니다. 엽산·비타민 A·E 등은 표시 기준이 동일한 경우만 비교하세요.</p>${NUTRIENTS.map(([k,n,u,t])=>{let a=0,b=0,known=0;for(const x of items){const v=foodMicro(x.id,k);if(v!=null){a+=Number(v)*Number(x.g)/100;known++}}let sk=0;for(const p of taken){const v=p.nutrients?.[k];if(v!=null){b+=Number(v);sk++}}const total=a+b,has=known+sk>0,den=Math.max(t||0,total,1);return `<div style="margin:12px 0"><div class="between tiny"><b>${n}</b><span>${has?Number(total.toPrecision(4)):'미확인'} / ${t??'기준 없음'} ${u}</span></div>${t&&has?`<div class="progress" style="display:flex"><i style="width:${a/den*100}%;background:#66a884"></i><i style="width:${b/den*100}%;background:#8596ce"></i></div>`:''}<div class="mini muted">식사 ${known?Number(a.toPrecision(4)):'미확인'} · 영양제 ${sk?Number(b.toPrecision(4)):'미기록'} ${u} ${known<items.length?' · 식품 일부 미확인':''}</div></div>`}).join('')}`}
function toggleProduct42(i,checked){const p=productCatalog()[i];if(!p)return;st.wellness=st.wellness||{};const w=st.wellness[st.date]||(st.wellness[st.date]={});w.productIntake=(w.productIntake||[]).filter(x=>x.id!==p.id);if(checked)w.productIntake.push({id:p.id,name:p.name,serving:p.serving,nutrients:clone(p.nutrients),verified:p.verified});save();const values=['waterMl','bowel','stool','period','dulcolax','dulcolaxCount'].map(k=>[k,$('#'+k)?.value]);render();for(const [k,v] of values)if(v!==undefined&&$('#'+k))$('#'+k).value=v}
function supplementIntakePanel(){const old=st.wellness?.[st.date]?.productIntake||[];return `<div class="note"><div class="between"><b>오늘 영양제 복용 체크</b><button class="btn sm" onclick="go('settings')">제품 관리</button></div>${productCatalog().map((p,i)=>`<label class="listline"><span><input type="checkbox" ${old.some(x=>x.id===p.id)?'checked':''} onchange="toggleProduct42(${i},this.checked)"> ${esc(p.name)}</span><span>${esc(p.serving)}</span></label>`).join('')||'설정에서 제품을 등록하세요.'}${old.filter(p=>!productCatalog().some(x=>x.id===p.id)).map(p=>`<div class="mini">과거 등록 제품: ${esc(p.name)} · 복용 기록 유지</div>`).join('')}<p class="mini">체크 즉시 1회분 저장 및 영양 합계 반영.</p></div>`}
async function enhanceLabel(file){const img=await createImageBitmap(file);const c=document.createElement('canvas');const scale=Math.min(2,2400/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.filter='grayscale(1) contrast(1.45)';ctx.drawImage(img,0,0,c.width,c.height);img.close();return c}

function nutritionPage(){return head('NUTRITION','영양 분석','선택 날짜의 식사와 복용 영양제를 합산합니다.')+datebar()+`<div class="panel"><div class="between"><b>하루 영양소 섭취량</b><span class="mini">식사 · 영양제</span></div>${dailyNutrients(entries().filter(x=>x.eaten).flatMap(x=>x.items))}</div><div class="panel">${supplementIntakePanel()}</div>`}
function seedSupplements43(){if(st.suppLabels431)return;const list=st.supplementProducts||(st.supplementProducts=[]);const defaults=[['probiotic','락토핏 솔루션1','아침 공복 · 1캡슐 (400mg)',{probiotic:10000000000}],['multi','쌩쌩타민','점심 식후 · 1일분 (표기 기준 확인 필요)',{b1:48,b2:56,b6:60,b12:100,biotin:300,b5:25,folate:680,b3:18,vitc:100,vitk:70,iron:14.4,zinc:10.2,copper:0.96,selenium:66,iodine:180,manganese:3.6,molybdenum:30,chromium:36,calcium:210,magnesium:105,vita:700,vitd:25,vite:11}],['omega','프로메가 오메가3 트리플','점심 식후 · 2캡슐',{omega3:900,vite:11}],['mag','NOW Magnesium Glycinate','취침 전 · 1정',{magnesium:100}]];const norm=x=>String(x).toLowerCase().replace(/[^a-z0-9가-힣]/g,'');for(const [id,name,serving,nutrients] of defaults){const p=list.find(p=>p.id==='default43_'+id||norm(p.name)===norm(name));if(p){p.nutrients={...nutrients,...(p.nutrients||{})};if(p.id==='default43_'+id){p.serving=serving;p.nutrients={...p.nutrients,...nutrients};p.verified=false}}else list.push({id:'default43_'+id,name,serving,nutrients,verified:false})}st.suppDefaults43=true;st.suppLabels431=true;save()}
